version: "3.9"

services:

  redis:
    image: redis:7-alpine
    container_name: catalyx_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: catalyx_api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./app:/app